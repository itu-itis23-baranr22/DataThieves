{% macro render_field(field, **kwargs) %}
  <div class="form-group mb-3">
    <label for="{{ field.id }}" class="form-label">{{ field.label }}</label>
    {{ field(class="form-control", **kwargs) }}

    {% if field.errors %}
      <ul class="form-errors mt-1">
        {% for error in field.errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
{% endmacro %}
