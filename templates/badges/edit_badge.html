{% extends "base.html" %}
{% block title %}Edit Badge{% endblock %}
{% block body %}
<style>
  body{
    background-image: url("{{ url_for('static', filename='imgs/background.jpg') }}");
    background-attachment: fixed;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    padding-top: 80px;
  }
  .white-panel{
    background:#fff; border-radius:8px; padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2); border:1px solid #e3e6e8;
  }
</style>

<div class="container mt-4">
  <div class="white-panel">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
      <h2 class="h5 mb-0">Edit Badge</h2>
      <a href="{{ url_for('users_badges_bp.badges') }}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <form method="POST">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">UserId</label>
          <input class="form-control" name="UserId" value="{{ badge.UserId }}" required>
        </div>
        <div class="col-md-9">
          <label class="form-label">Name</label>
          <input class="form-control" name="Name" value="{{ badge.Name }}" required>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('users_badges_bp.badges') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
