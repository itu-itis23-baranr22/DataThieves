{% extends "layout.html" %}
{% from "includes/formhelpers.html" import render_field %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h3>Giriş Yap</h3>
    <p class="text-muted">Hesabınıza giriş yapın.</p>
    <hr>

    <form method="post">
        {{ render_field(form.DisplayName, placeholder="Ad Soyad") }}
        {{ render_field(form.id, placeholder="ID") }}
        <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
    </form>
  </div>
</div>
{% endblock body %}
