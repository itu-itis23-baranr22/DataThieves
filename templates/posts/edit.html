{% extends "layout.html" %}
{% block title %}Edit Post{% endblock %}

{% block body %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="mb-3">Edit Post #{{ post.Id }}</h3>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input class="form-control" name="Title" value="{{ form.Title.data }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Body</label>
          <textarea class="form-control" name="Body" rows="8">{{ form.Body.data }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Tags</label>
          <input class="form-control" name="Tags" value="{{ form.Tags.data }}" placeholder="python,flask,sql">
        </div>

        <div class="mb-3">
          <label class="form-label">Edit comment (commit message)</label>
          <input class="form-control" name="EditComment" maxlength="255"
                 value="{{ request.form.get('EditComment','') }}"
                 placeholder="e.g. fixed typo, improved explanation...">
          <div class="form-text">Saved into PostHistory.Comment</div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('posts_bp.forum_posts') }}">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
