{% extends "base.html" %}
{% block title %}Add New User - Stack Stats{% endblock %}

{% block body %}
<style>
  body{
    background-image: url("{{ url_for('static', filename='imgs/background.jpg') }}");
    background-attachment: fixed;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    padding-top: 80px;
  }
  .white-panel{
    background:#fff;
    border-radius:8px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    border:1px solid #e3e6e8;
    max-width: 700px;
    margin: auto;
  }
</style>

<div class="container mt-4">
  <div class="white-panel">

    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h2 class="h4 mb-0">Add New User</h2>
      <a href="{{ url_for('users_badges_bp.users') }}"
         class="btn btn-outline-secondary btn-sm">
        Back to Users
      </a>
    </div>

    <form method="POST">

      <div class="mb-3">
        <label class="form-label">Display Name</label>
        {{ form.DisplayName(class="form-control") }}
      </div>


      <div class="mb-3">
        <label class="form-label">Location</label>
        {{ form.Location(class="form-control") }}
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        {{ form.Age(class="form-control") }}
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('users_badges_bp.users') }}"
           class="btn btn-outline-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-success">
          <i class="fa-solid fa-plus"></i> Add User
        </button>
      </div>

    </form>

  </div>
</div>
{% endblock %}
