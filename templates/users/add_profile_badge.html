{% extends "layout.html" %}
{% block title %}Add Badge{% endblock %}

{% block body %}
<style>
  body {
    background-image: url("{{ url_for('static', filename='imgs/background.jpg') }}");
    background-attachment: fixed;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    padding-top: 80px;
  }
  .white-panel {
    background-color: #ffffff;
    border-radius: 8px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 1px solid #e3e6e8;
  }
</style>

<div class="white-panel">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <h2 class="h5 mb-0">Add Badge</h2>
    <a href="{{ url_for('users_badges_bp.user_profile', user_id=session.get('user_id')) }}"
       class="btn btn-outline-secondary btn-sm">Back</a>
  </div>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Choose from default badges</label>
      {{ form.preset(class="form-select") }}
    </div>

    <div class="text-center text-muted small my-2">— OR —</div>

    <div class="mb-3">
      <label class="form-label">Custom badge name</label>
      {{ form.custom(class="form-control", placeholder="e.g. Backend Wizard") }}
    </div>

    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
      <a href="{{ url_for('users_badges_bp.user_profile', user_id=session.get('user_id')) }}"
         class="btn btn-outline-secondary">Cancel</a>
      <button class="btn btn-success" type="submit">Add</button>
    </div>
  </form>
</div>
{% endblock %}
