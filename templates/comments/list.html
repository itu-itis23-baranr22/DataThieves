<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorum Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .page-header { display: flex; align-items: center; margin-bottom: 20px; margin-top: 20px; }
        .home-link { color: #6f42c1; font-weight: bold; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        .home-link:hover { text-decoration: underline; }
        .table-header-gray { background-color: #e9ecef; }
        .btn-edit { font-size: 0.8rem; padding: 2px 8px; border-color: #dee2e6; background-color: #fff; color: #333; }
        .btn-delete { font-size: 0.8rem; padding: 2px 8px; }
    </style>
</head>
<body>
    <div class="container-fluid px-4">
        <div class="page-header">
            <h2 class="mb-0 fw-bold"><i class="fa-solid fa-comments text-secondary"></i> Yorum Yönetimi</h2>
            <a href="/" class="home-link"><i class="fa-solid fa-house-chimney"></i> Ana Sayfaya Dön</a>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <form action="{{ url_for('comments_votes_bp.comments') }}" method="GET" class="d-flex">
                    <input type="text" name="q" class="form-control me-2" placeholder="Yorum Ara..." value="{{ request.args.get('q', '') }}">
                    <button type="submit" class="btn btn-outline-secondary me-1">Ara</button>
                    <a href="{{ url_for('comments_votes_bp.comments') }}" class="btn btn-outline-secondary">Sıfırla</a>
                </form>
            </div>
            <a href="/comments/add" class="btn btn-success">
                <i class="fa-solid fa-plus"></i> Yeni Comment Ekle
            </a>
        </div>

        <div class="card shadow-sm rounded-0">
            <div class="card-body p-0">
                <table class="table table-striped table-bordered table-hover mb-0">
                    <thead class="table-header-gray">
                        <tr>
                            <th>Id</th>
                            <th>PostId</th>
                            <th>User</th>
                            <th>Text</th>
                            <th>Score</th>
                            <th>Date</th>
                            <th style="width: 140px; text-align: center;">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in comments %}
                        <tr>
                            <td class="align-middle">{{ c.Id }}</td>
                            <td class="align-middle">{{ c.PostId }}</td>
                            <td class="align-middle">{{ c.UserDisplayName }} ({{ c.UserId }})</td>
                            <td class="align-middle text-truncate" style="max-width: 300px;">{{ c.Text }}</td>
                            <td class="align-middle">{{ c.Score }}</td>
                            <td class="align-middle">{{ c.CreationDate }}</td>
                            <td class="align-middle text-center">
                                <button class="btn btn-edit btn-sm me-1">Düzenle</button>
                                <button class="btn btn-danger btn-sm btn-delete">Sil</button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
