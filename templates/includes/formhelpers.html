{% macro render_field(field, placeholder=None, type='text', class='form-control') %}
    <div class="form-group mb-3">
        {% if field.label %}
            <label for="{{ field.id }}" class="form-label">{{ field.label.text }}</label>
        {% endif %}
        
        <input 
            type="{{ type }}" 
            class="{{ class }} {% if field.errors %}is-invalid{% endif %}" 
            id="{{ field.id }}" 
            name="{{ field.name }}" 
            {% if field.data %}value="{{ field.data }}"{% endif %}
            {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
            {% if field.flags.required %}required{% endif %}
            {{ kwargs|safe }}
        >
        
        {% if field.errors %}
            <div class="invalid-feedback">
                {% for error in field.errors %}
                    <span>{{ error }}</span>
                {% endfor %}
            </div>
        {% endif %}
    </div>
{% endmacro %}
