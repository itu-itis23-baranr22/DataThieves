<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .page-header { display: flex; align-items: center; margin-bottom: 20px; margin-top: 20px; }
        .home-link { color: #6f42c1; font-weight: bold; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        .home-link:hover { text-decoration: underline; }
        .table-header-gray { background-color: #e9ecef; }
        .btn-edit { font-size: 0.8rem; padding: 2px 8px; border-color: #dee2e6; background-color: #fff; color: #333; }
        .btn-delete { font-size: 0.8rem; padding: 2px 8px; }
    </style>
</head>
<body>
    <div class="container-fluid px-4">
        <div class="page-header">
            <h2 class="mb-0 fw-bold"><i class="fa-solid fa-file-lines text-secondary"></i> Post Yönetimi</h2>
            <a href="/" class="home-link"><i class="fa-solid fa-house-chimney"></i> Ana Sayfaya Dön</a>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 d-flex">
                <input type="text" class="form-control me-2" placeholder="Başlık Ara...">
                <button class="btn btn-outline-secondary me-1">Ara</button>
                <button class="btn btn-outline-secondary">Sıfırla</button>
            </div>
        </div>

        <div class="card shadow-sm rounded-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover mb-0">
                        <thead class="table-header-gray">
                            <tr>
                                <th>Id</th>
                                <th>Title</th>
                                <th>Score</th>
                                <th>Views</th>
                                <th>Answers</th>
                                <th>Comments</th>
                                <th>Date</th>
                                <th style="width: 140px; text-align: center;">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for p in posts %}
                            <tr>
                                <td class="align-middle">{{ p.Id }}</td>
                                <td class="align-middle">{{ p.Title }}</td>
                                <td class="align-middle">{{ p.Score }}</td>
                                <td class="align-middle">{{ p.ViewCount }}</td>
                                <td class="align-middle">{{ p.AnswerCount }}</td>
                                <td class="align-middle">{{ p.CommentCount }}</td>
                                <td class="align-middle">{{ p.CreationDate }}</td>
                                <td class="align-middle text-center">
                                    <button class="btn btn-edit btn-sm me-1">Düzenle</button>
                                    <button class="btn btn-danger btn-sm btn-delete">Sil</button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
